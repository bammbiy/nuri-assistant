# Runs the unit tests, pyflakes and the UI smoke test (tests/test_ui_smoke.py) on every push to main.
# Linux has no display, so it uses xvfb; the Windows runner has a desktop and opens the windows directly.
name: tests

on:
  push:
    branches: [main]  # the working branch gets the same commits, so run on main only
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install check tools
        run: python -m pip install pyflakes pillow
      - name: pyflakes
        run: python -m pyflakes src tests tools
      - name: Tests (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tail -40
        shell: bash -o pipefail {0}
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -W error::ResourceWarning -m unittest discover -s tests

  exe:
    # Windows program folder (tools/build_exe.py). The build also starts the program once (--selfcheck).
    # Download it from this run's Artifacts; pushing a tag that starts with v also attaches it to a release.
    name: Windows exe
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller pillow tzdata
      - name: Build and self-check
        run: python tools/build_exe.py
      - name: Show error.log on failure
        if: failure()
        shell: bash
        run: cat ~/.nuri-assistant/error.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: NuriAssistant-windows
          path: dist/NuriAssistant
          retention-days: 30
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/NuriAssistant-windows.zip --title "${GITHUB_REF_NAME}" --generate-notes
