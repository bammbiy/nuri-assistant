# 푸시할 때마다 단위 테스트, pyflakes, UI 스모크 테스트(tests/test_ui_smoke.py)를 돌립니다.
# 리눅스는 화면이 없어 xvfb로, 윈도우 러너는 바탕화면이 있어 그대로 창을 띄웁니다.
name: tests

on:
  push:
    branches: [main]  # 작업 브랜치와 main에 같은 커밋을 올리므로 main에서만 돌림
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install check tools
        run: python -m pip install pyflakes pillow
      - name: pyflakes
        run: python -m pyflakes src tests tools
      - name: Tests (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tail -40
        shell: bash -o pipefail {0}
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -W error::ResourceWarning -m unittest discover -s tests

  exe:
    # Windows 실행 파일 묶음(tools/build_exe.py). 빌드한 프로그램이 실제로 켜지는지(--selfcheck)까지 확인합니다.
    # 결과는 이 실행의 Artifacts에서 받고, v로 시작하는 태그를 푸시하면 릴리스에도 올립니다.
    name: Windows exe
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller pillow
      - name: Build and self-check
        run: python tools/build_exe.py
      - name: Show error.log on failure
        if: failure()
        shell: bash
        run: cat ~/.nuri-assistant/error.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: NuriAssistant-windows
          path: dist/NuriAssistant
          retention-days: 30
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/NuriAssistant-windows.zip --title "${GITHUB_REF_NAME}" --generate-notes
