# 푸시할 때마다 단위 테스트, pyflakes, UI 스모크 테스트(tests/test_ui_smoke.py)를 돌립니다.
# 리눅스는 화면이 없어 xvfb로, 윈도우 러너는 바탕화면이 있어 그대로 창을 띄웁니다.
name: tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install check tools
        run: python -m pip install pyflakes pillow
      - name: pyflakes
        run: python -m pyflakes src tests tools
      - name: Tests (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python -W error::ResourceWarning -m unittest discover -s tests -v 2>&1 | tail -40
        shell: bash -o pipefail {0}
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -W error::ResourceWarning -m unittest discover -s tests
